name: 42u

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main, master]
    paths:
      - "42u.sh"
      - "42u.md"
      - ".github/workflows/42u.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [forty_two_u]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify 42u.sh certificate
        run: |
          set -euo pipefail
          BYTES=$(wc -c < 42u.sh | tr -d ' ')
          echo "bytes=$BYTES"
          test "$BYTES" -lt 4096
          rm -f state.json
          LOG_TM_STATE=state.json CMD=step N=3 bash 42u.sh | tee cert.json
          python3 - <<'PY'
          import json
          o=json.load(open("cert.json"))
          L=o.get("L") or {}
          assert o.get("C") is True
          assert o.get("CG") is True
          assert o.get("t")==3
          assert o.get("G")==42
          assert o.get("E")==[1,1,0,1,0,0]
          assert o.get("n")==1 and o.get("p")==2
          assert isinstance(L.get("V"), list) and len(L["V"])>=13
          assert "2^1" in (L.get("G") or "")
          assert "riemann" in (L.get("Q") or {})
          print("PASS step", "t=", o["t"], "G=", o["G"], "LG=", L.get("G"))
          PY
          LOG_TM_STATE=state.json CMD=reconstruct N=1 bash 42u.sh | tee cert-recon.json
          python3 - <<'PY'
          import json
          o=json.load(open("cert-recon.json"))
          assert o.get("C") is True and o.get("CF") is True
          assert o.get("CG") is True
          print("PASS reconstruct", "t=", o["t"], "CF=", o["CF"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 42u-certificate
          path: |
            cert.json
            cert-recon.json
